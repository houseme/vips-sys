[package]
name = "vips-sys"
version = "0.2.0"
authors = ["elbaro <elbaro@github>", "houseme <housemecn@gmail.com"]
edition = "2024"
resolver = "3"
description = "libvips bindings for Rust"
documentation = "https://houseme.github.io/vips-sys/vips_sys/"
repository = "https://github.com/houseme/vips-sys"
readme = "README.md"
keywords = ["vips", "image", "libvips"]
categories = ["multimedia::images", "external-ffi-bindings"]
license = "MIT"
links = "vips"
exclude = ["vendor/", "target/"]

[lib]
doctest = false

[features]
default = []
# Regenerate FFI bindings with clang/bindgen against local headers.
# Default builds use the pregenerated file in src/bindings/prebuilt.rs.
bindgen = ["dep:bindgen"]
# Link a tiny C stub when no system libvips is found (for `cargo test` in CI
# or sandboxes). Never preferred when a real library is available.
stub = ["dep:cc"]
static = []
dynamic = []
helpers = []

[build-dependencies]
pkg-config = "0.3.34"
bindgen = { version = "0.73.2", optional = true, default-features = false, features = ["runtime", "logging"] }
cc = { version = "1.2", optional = true }

[target.'cfg(target_env = "msvc")'.build-dependencies]
vcpkg = { version = "0.2.15" }

[package.metadata.docs.rs]
# Do not enable `bindgen` on docs.rs — it needs libclang + vips headers.
features = ["helpers"]
default-target = "x86_64-unknown-linux-gnu"
